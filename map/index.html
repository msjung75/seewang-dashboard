<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>세왕 거래처 지도</title>

<style>
  :root {
    color-scheme: dark;
    --acc1:#3b82f6; --acc2:#1e40af; --accg:linear-gradient(135deg,var(--acc1),var(--acc2));
  }
  body.brand-hite { --acc1:#00b775; --acc2:#00694a; }
  body.brand-ob   { --acc1:#3b78e0; --acc2:#123a7a; }
  html,body { margin:0; padding:0; height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    background:#080e1c; color:#fff;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px; box-sizing:border-box;
    overflow:hidden;
  }
  /* 배경 오라 */
  .aura { position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(70px); opacity:.5;
    background:
      radial-gradient(38% 34% at 22% 24%, var(--acc1) 0%, transparent 70%),
      radial-gradient(42% 38% at 80% 76%, var(--acc2) 0%, transparent 70%),
      radial-gradient(30% 30% at 75% 18%, #7c3aed33 0%, transparent 70%);
    animation:aurafloat 14s ease-in-out infinite alternate;
    transition:background 1s;
  }
  @keyframes aurafloat { from{ transform:translate(-2%,-1%) scale(1);} to{ transform:translate(2%,2%) scale(1.06);} }
  .card {
    position:relative; z-index:1;
    background: rgba(255,255,255,0.055);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.13);
    border-radius:22px;
    padding:38px 28px 30px;
    width:100%; max-width:390px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    text-align:center;
    animation:cardin .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardin { from{ opacity:0; transform:translateY(14px) scale(.98);} to{ opacity:1; transform:none;} }
  .logo {
    width:68px; height:68px; border-radius:17px;
    background:var(--accg);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    font-weight:800; font-size:26px; letter-spacing:-1px;
    box-shadow:0 10px 30px color-mix(in srgb, var(--acc1) 45%, transparent);
    transition:background .5s;
  }
  h1 { margin:0 0 6px; font-size:21px; font-weight:800; letter-spacing:-0.4px; }
  h1 .x { opacity:.55; font-weight:500; padding:0 4px; }
  .sub { margin:0 0 24px; font-size:13px; color:rgba(255,255,255,0.6); }
  input {
    width:100%; box-sizing:border-box;
    padding:14px 16px; font-size:18px;
    border:1px solid rgba(255,255,255,0.16);
    border-radius:13px;
    background:rgba(0,0,0,0.28);
    color:#fff;
    text-align:center;
    outline:none;
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  input:focus { border-color:var(--acc1); background:rgba(0,0,0,0.42); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc1) 22%, transparent); }
  #p { letter-spacing:6px; }
  #repbox { display:none; }
  #repbox input { margin-top:10px; font-size:16px; letter-spacing:normal; }
  #rcode { letter-spacing:1px; }
  /* 담당자 빠른 선택 */
  #brandbtns { display:flex; gap:9px; margin-top:12px; }
  .bbtn {
    flex:1; padding:11px 4px; font-size:12.5px; font-weight:700; cursor:pointer;
    color:rgba(255,255,255,.82);
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14); border-radius:12px;
    transition:all .15s;
  }
  .bbtn:active { transform:scale(.97); }
  .bbtn.hite:hover { border-color:#00b775; color:#5ee6ae; }
  .bbtn.ob:hover { border-color:#3b78e0; color:#8ab4ff; }
  button.main {
    margin-top:13px; width:100%;
    padding:14px; font-size:15px; font-weight:700;
    border:none; border-radius:13px; cursor:pointer;
    background:var(--accg);
    color:#fff;
    transition:transform .1s, box-shadow .15s, background .5s;
  }
  button.main:hover { box-shadow:0 10px 26px color-mix(in srgb, var(--acc1) 40%, transparent); }
  button.main:active { transform:scale(0.98); }
  button.main:disabled { opacity:0.6; cursor:wait; }
  .err { color:#fca5a5; font-size:13px; margin-top:12px; min-height:18px; }
  .legal { display:none; margin-top:14px; font-size:10.5px; line-height:1.55; color:rgba(255,255,255,0.42); }
  body.brand-hite .legal, body.brand-ob .legal { display:block; }
  .footer { margin-top:22px; font-size:11px; color:rgba(255,255,255,0.38); }
  .footer a { color:rgba(255,255,255,0.48); }
  .remember { display:flex; align-items:center; justify-content:center; gap:8px;
              margin-top:13px; font-size:13px; color:rgba(255,255,255,0.65); cursor:pointer; }
  .remember input { width:16px; height:16px; cursor:pointer; }
  .loader {
    display:none; margin:16px auto 0;
    width:30px; height:30px;
    border:3px solid rgba(255,255,255,0.2);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #back { display:none; margin-top:13px; font-size:12.5px; color:rgba(255,255,255,0.5); cursor:pointer; }
  /* ---- 협업 입장 스플래시 ---- */
  #splash {
    position:fixed; inset:0; z-index:50; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%, color-mix(in srgb, var(--acc2) 55%, #060b16) 0%, #060b16 75%);
    text-align:center; padding:30px; box-sizing:border-box;
  }
  #splash.on { display:flex; animation:spin-none; }
  .spmark { font-size:15px; font-weight:700; letter-spacing:.34em; color:color-mix(in srgb, var(--acc1) 80%, #fff);
            text-transform:uppercase; opacity:0; animation:rise .7s .1s forwards; }
  .sptitle { margin-top:14px; font-size:30px; font-weight:800; letter-spacing:-0.5px; opacity:0; animation:rise .7s .3s forwards; }
  .sptitle .x { opacity:.5; font-weight:400; padding:0 8px; }
  .spsub { margin-top:10px; font-size:14px; color:rgba(255,255,255,.66); opacity:0; animation:rise .7s .5s forwards; }
  .spbar { margin-top:26px; width:150px; height:3px; border-radius:2px; background:rgba(255,255,255,.14); overflow:hidden;
           opacity:0; animation:rise .5s .6s forwards; }
  .spbar i { display:block; height:100%; width:0; background:var(--accg); animation:fill 1.7s .7s cubic-bezier(.3,0,.2,1) forwards; }
  .splegal { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 26px); left:26px; right:26px;
             font-size:10.5px; line-height:1.55; color:rgba(255,255,255,.4); opacity:0; animation:rise .7s .8s forwards; }
  @keyframes rise { from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
  @keyframes fill { to{ width:100%; } }
</style>
</head>
<body>
  <div class="aura"></div>
  <div class="card" id="card">
    <div class="logo" id="logo">세왕</div>
    <h1 id="ttl">세왕 거래처 지도</h1>
    <p class="sub" id="sub">비밀번호 또는 담당자 아이디를 입력하세요</p>
    <form id="f" autocomplete="off">
      <input id="p" type="password" autocomplete="off" autofocus placeholder="비밀번호 · 아이디" />
      <div id="brandbtns">
        <button type="button" class="bbtn hite" id="bb_hite">🍺 하이트 담당</button>

      <div id="repbox">
        <input id="rname" type="text" autocomplete="off" placeholder="이름 (본인 실명)" />

      <label class="remember" id="rmwrap"><input type="checkbox" id="rm" checked /> 이번 탭에서만 로그인 유지 · 15분 미사용 시 잠금</label>
      <button class="main" id="b" type="submit">열기</button>
      <div class="err" id="err"></div>
      <div class="loader" id="ld"></div>
      <div id="back">← 처음 화면으로</div>
      <div class="legal">본 지도는 세왕상사의 영업 자료입니다. 화면·자료를 외부에 유출하거나 공유할 경우 민·형사상 책임이 따를 수 있습니다.</div>
    </form>
    <div class="footer">세왕상사 · 내부용 · <a id="forget" href="#">이 기기 정보 지우기</a></div>
  </div>

  <!-- 협업 입장 스플래시 -->
  <div id="splash">
    <div class="spmark" id="spmark">PARTNERSHIP</div>
    <div class="sptitle" id="sptitle"></div>
    <div class="spsub" id="spsub"></div>
    <div class="spbar"><i></i></div>
    <div class="splegal">본 지도는 세왕상사의 영업 자료입니다. 외부 유출·공유 시 민·형사상 책임이 따를 수 있습니다.</div>
  </div>

  /* ---- 설정(접속기록 서버) ---- */
  let CFG = {};
  const cfgReady = fetch('./config.json?t='+Date.now(), {cache:'no-store'})
    .then(r=>r.json()).then(c=>{ CFG=c||{}; }).catch(()=>{});

  function logEv(ev, role, name, dev){
    if (!CFG.logUrl) return;
    try {
      fetch(CFG.logUrl, {method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({t:new Date().toISOString(), ev:ev, role:role||'', name:name||'',
                              dev:dev||'', ua:(navigator.userAgent||'').slice(0,140)})});
    } catch(_){}
  }
  async function checkDevice(dev, role){
    if (!CFG.logUrl || !dev) return 'net';
    try {
      const ctl = new AbortController();
      setTimeout(()=>ctl.abort(), 5000);
      const r = await fetch(CFG.logUrl+'?fn=check&dev='+encodeURIComponent(dev)+'&role='+encodeURIComponent(role||''), {signal:ctl.signal});
      const j = await r.json();
      return j.st === 'ok' ? 'ok' : (j.st === 'block' ? 'block' : 'net');
    } catch(_){ return 'net'; }
  }

  function getReg(){ try { return JSON.parse(sessionStorage.getItem(REG_KEY)||'null'); } catch(_){ return null; } }
  function clearReg(){ try { sessionStorage.removeItem(REG_KEY); localStorage.removeItem(REG_KEY); } catch(_){} }

  forget.addEventListener('click', (e)=>{
    e.preventDefault();
    try { localStorage.removeItem(STORAGE_KEY); } catch(_){}
    try { sessionStorage.removeItem(STORAGE_KEY); } catch(_){}
    clearReg();
    err.textContent = '이 기기의 저장 정보가 삭제되었습니다';
    p.value = '';
    showMain();
  });

  function b64ToBuf(b64){
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }
  async function deriveKey(password, salt, iters){
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:iters, hash:'SHA-256' },
      baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  }
  async function openPayload(pl, pw){
    for (const sl of (pl.slots||[])){
      try {
        const kek = await deriveKey(pw, b64ToBuf(sl.s), pl.iter);
        const wj = JSON.parse(new TextDecoder().decode(
          await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBuf(sl.i)}, kek, b64ToBuf(sl.w))));
        const dk = await crypto.subtle.importKey('raw', b64ToBuf(wj.k), 'AES-GCM', false, ['decrypt']);
        const html = new TextDecoder('utf-8').decode(
          await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBuf(pl.iv)}, dk, b64ToBuf(pl.ct)));
        return {html:html, role:wj.r||'all', label:wj.lb||''};
      } catch(_){}
    }
    return null;
  }

  function busy(on){ b.disabled = on; ld.style.display = on?'block':'none'; if(on) err.textContent=''; }
  function writeApp(res, name, dev){
    try { sessionStorage.setItem('sw_role', res.role); sessionStorage.setItem('sw_user', name||''); sessionStorage.setItem('sw_dev', dev||''); } catch(_){}
    document.open(); document.write(res.html); document.close();
  }
  /* 담당자: 협업 스플래시 → 지도 진입 */
  function enter(res, name, dev){
    logEv('login', res.role, name, dev);
    if (res.role === 'all'){ writeApp(res, name, dev); return; }
    const bd = BRAND[res.role] || BRAND.hite;
    document.body.classList.add(bd.cls);
    $('sptitle').innerHTML = bd.name + '<span class="x">×</span>세왕상사';
    $('spsub').textContent = bd.partner + (name ? ' · ' + name + '님 환영합니다' : '');
    $('splash').classList.add('on');
    setTimeout(()=>writeApp(res, name, dev), 2600);
  }
  function applyBrand(role){
    document.body.classList.remove('brand-hite','brand-ob');
    if (role){ document.body.classList.add(BRAND[role].cls); }
  }
  function showRep(role){
    repRole = role;
    const bd = BRAND[role];
    applyBrand(role);
    $('logo').textContent = bd.logo;
    $('ttl').innerHTML = bd.name + '<span class="x">×</span>세왕상사';
    $('sub').textContent = bd.partner + ' · 이번 브라우저 세션 인증';
    p.style.display='none';
    $('brandbtns').style.display='none';
    $('rmwrap').style.display='none';
    $('repbox').style.display='block';
    back.style.display='block';
    b.textContent='기기 등록';
    $('rname').focus();
  }
  function showMain(){
    repRole = null;
    applyBrand(null);
    $('logo').textContent = '세왕';
    $('ttl').textContent = '세왕 거래처 지도';
    $('sub').textContent = '비밀번호 또는 담당자 아이디를 입력하세요';
    p.style.display='block';
    $('brandbtns').style.display='flex';
    $('rmwrap').style.display='flex';
    $('repbox').style.display='none';
    back.style.display='none';
    b.textContent='열기';
  }
  back.onclick = showMain;

  async function bossUnlock(pw, savePw){
    await cfgReady;
    const res = await openPayload(payload, pw);
    if (!res) return false;
    if (savePw){ try { sessionStorage.setItem(STORAGE_KEY, pw); } catch(_){} }
    enter(res, '대표', '');
    return true;
  }
  /* 담당자 unlock: 'ok'|'bad'|'net'|'block' */
  async function repUnlock(role, cred, name, dev, isNew){
    await cfgReady;
    let pl;
    try {
      const r = await fetch('./'+role+'.json?t='+Date.now(), {cache:'no-store'});
      if (!r.ok) throw 0;
      pl = await r.json();
    } catch(_){ return 'net'; }
    const res = await openPayload(pl, cred);
    if (!res) return 'bad';
    const st = await checkDevice(dev, role);
    if (st === 'net') return 'net';
    if (st === 'block'){ clearReg(); logEv('blocked', role, name, dev); return 'block'; }
    if (isNew){
      try { sessionStorage.setItem(REG_KEY, JSON.stringify({role:role, name:name, dev:dev, cred:cred, at:new Date().toISOString()})); } catch(_){}
      logEv('register', role, name, dev);
    }
    enter(res, name, dev);
    return 'ok';
  }

  async function startRep(role){
    const reg = getReg();
    if (reg && reg.role===role && reg.cred){
      applyBrand(role);
      busy(true);
      const r = await repUnlock(role, reg.cred, reg.name, reg.dev, false);
      busy(false);
      if (r==='bad'){ clearReg(); err.textContent='등록이 만료되었습니다. 다시 등록해주세요.'; showRep(role); }
      else if (r==='net'){ err.textContent='네트워크 연결이 필요합니다'; }
      else if (r==='block'){ err.textContent='이 기기는 차단되어 있습니다. 세왕상사에 문의하세요.'; }
      return;
    }
    showRep(role);
  }
  $('bb_hite').onclick = ()=>startRep('hite');
  $('bb_ob').onclick = ()=>startRep('ob');
  Object.keys(BRAND).filter(k=>!['hite','ob'].includes(k)).forEach(k=>{
    const btn=document.createElement('button');btn.type='button';btn.textContent=BRAND[k].label;
    btn.onclick=()=>startRep(k);$('brandbtns').appendChild(btn);
  });

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (repRole){
      const name = $('rname').value.trim(), code = $('rcode').value.trim();
      if (!name){ err.textContent='이름을 입력하세요'; return; }
      if (!code){ err.textContent='등록코드를 입력하세요'; return; }
      busy(true);
      const dev = Array.from(crypto.getRandomValues(new Uint8Array(5))).map(x=>x.toString(16).padStart(2,'0')).join('');
      const r = await repUnlock(repRole, repRole+':'+code, name, dev, true);
      busy(false);
      if (r==='bad'){ err.textContent='등록코드가 올바르지 않습니다'; logEv('fail', repRole, name, ''); $('rcode').select(); }
      else if (r==='net'){ err.textContent='네트워크 연결이 필요합니다'; }
      else if (r==='block'){ err.textContent='이 기기는 차단되어 있습니다. 세왕상사에 문의하세요.'; }
      return;
    }
    const v = p.value.trim();
    const role = REP_IDS[v.toLowerCase()];
    if (role){ startRep(role); return; }
    busy(true);
    const ok = await bossUnlock(v, rm.checked);
    if (!ok){
      busy(false);
      try { localStorage.removeItem(STORAGE_KEY); } catch(_){}
      logEv('fail', '', '', '');
      err.textContent = '비밀번호가 올바르지 않습니다';
      p.select();
    }
  });

  /* 자동 로그인: ① 저장된 대표 비번 ② 등록된 담당자 기기 */
  (async ()=>{
    let saved = null;
    try { saved = sessionStorage.getItem(STORAGE_KEY); } catch(_){}
    if (saved){
      busy(true);
      const ok = await bossUnlock(saved, true);
      if (!ok){ busy(false); err.textContent = '비밀번호를 입력해주세요'; p.focus(); }
      return;
    }
    const reg = getReg();
    if (reg && reg.cred){
      applyBrand(reg.role);
      busy(true);
      const r = await repUnlock(reg.role, reg.cred, reg.name, reg.dev, false);
      busy(false);
      if (r==='bad'){ clearReg(); err.textContent='다시 등록해주세요'; showRep(reg.role); }
      else if (r==='net'){ err.textContent='네트워크 연결 후 다시 열어주세요'; }
      else if (r==='block'){ err.textContent='이 기기는 차단되어 있습니다. 세왕상사에 문의하세요.'; }
    }
  })();
})();
</script>
